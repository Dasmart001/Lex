<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>LexAI — Legal Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#000000;
    --line:rgba(0,0,0,0.12);
    --line-soft:rgba(0,0,0,0.07);
    --hover:rgba(0,0,0,0.045);
    --dim:rgba(0,0,0,0.55);
    --faint:rgba(0,0,0,0.35);
    --inv:#FFFFFF;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--ink); color:var(--inv); }
  .serif{ font-family:'Libre Caslon Text',serif; }
  .mono{ font-family:'Space Mono',monospace; }

  .app{ display:flex; height:100dvh; width:100%; overflow:hidden; position:relative; }

  /* ================= SIDEBAR (Claude-style) ================= */
  .sidebar{ width:264px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--line); display:flex; flex-direction:column; height:100%; overflow:hidden; transition:width .2s ease, border-color .2s ease, opacity .15s ease; }
  .sidebar.closed{ width:0; border-right-color:transparent; opacity:0; }
  .sidebar.closed > *{ pointer-events:none; }

  .sb-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 14px 12px 16px; }
  .sb-brand{ display:flex; align-items:center; gap:10px; }
  .logo-mark{ width:26px; height:26px; flex-shrink:0; color:var(--ink); }
  .sb-brand .mark{ font-family:'Libre Caslon Text',serif; font-style:italic; font-size:18px; }
  .sb-head-icons{ display:flex; gap:2px; }
  .icon-btn{ background:transparent; border:none; color:var(--ink); cursor:pointer; padding:7px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--hover); }

  .sb-primary{ padding:2px 10px 10px 10px; display:flex; flex-direction:column; gap:1px; }
  .sb-row{
    display:flex; align-items:center; gap:12px; padding:9px 9px; border-radius:7px; cursor:pointer;
    font-size:13.5px; color:var(--ink); font-family:'Public Sans',sans-serif; font-weight:500; background:transparent; border:none; width:100%; text-align:left;
  }
  .sb-row:hover:not(.disabled){ background:var(--hover); }
  .sb-row.active{ background:var(--hover); font-weight:600; }
  .sb-row svg{ flex-shrink:0; }
  .sb-row.disabled{ color:var(--faint); cursor:default; }
  .sb-row .soon{ margin-left:auto; font-family:'Space Mono',monospace; font-size:9px; color:var(--faint); border:1px solid var(--line); padding:1px 5px; border-radius:3px; }

  .sb-section{ padding:16px 18px 6px 18px; font-size:11.5px; color:var(--faint); display:flex; align-items:center; justify-content:space-between; }
  .sb-section .sb-filter{ cursor:pointer; color:var(--faint); display:flex; }
  .sb-section .sb-filter:hover{ color:var(--ink); }

  .threads{ flex:1; overflow-y:auto; padding:0 10px; }
  .thread-item{
    padding:8px 9px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px;
  }
  .thread-item.active{ background:var(--hover); color:var(--ink); font-weight:600; }
  .thread-item:hover:not(.active){ background:var(--hover); }

  .sb-foot{ padding:12px 14px calc(14px + var(--safe-b)) 14px; border-top:1px solid var(--line); display:flex; align-items:center; gap:9px; }
  .pill-newchat{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--ink); color:var(--inv);
    border:none; border-radius:24px; padding:10px 15px; font-size:13.5px; font-weight:600; font-family:'Public Sans',sans-serif;
    cursor:pointer; transition:opacity .12s;
  }
  .pill-newchat:hover{ opacity:.82; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--ink); border:none; color:var(--inv); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; font-family:'Public Sans',sans-serif; cursor:pointer; transition:opacity .12s; padding:0; margin-left:auto; }
  .avatar:hover{ opacity:.82; }

  /* ---- settings modal ---- */
  .modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:flex-end; justify-content:center; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background:var(--bg); width:100%; max-width:400px; border-radius:18px 18px 0 0; padding:8px 0 calc(10px + var(--safe-b)) 0; border:1px solid var(--line); border-bottom:none; max-height:78vh; overflow-y:auto; }
  @media(min-width:640px){
    .modal-backdrop{ align-items:center; }
    .modal{ border-radius:16px; border-bottom:1px solid var(--line); max-width:360px; }
  }
  .modal-handle{ width:36px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 4px auto; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 12px 18px; border-bottom:1px solid var(--line-soft); }
  .modal-head .t{ font-family:'Libre Caslon Text',serif; font-style:italic; font-size:17px; }
  .modal-body{ padding:8px 8px 14px 8px; }
  .modal-row{ display:flex; align-items:center; gap:13px; padding:12px 12px; border-radius:9px; cursor:pointer; font-size:13.5px; }
  .modal-row:hover{ background:var(--hover); }
  .modal-row svg{ flex-shrink:0; color:var(--dim); }
  .modal-row .sub{ font-size:11px; color:var(--faint); margin-top:1px; }
  .modal-divider{ height:1px; background:var(--line-soft); margin:8px 12px; }
  .modal-profile{ display:flex; align-items:center; gap:12px; padding:14px 18px 6px 18px; }
  .modal-avatar{ width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--inv); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; }
  .modal-name{ font-weight:600; font-size:14.5px; }
  .modal-plan{ font-size:11.5px; color:var(--faint); margin-top:1px; }

  .backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:20; }
  .backdrop.show{ display:block; }

  /* ================= MAIN ================= */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative; }

  .topbar{ display:flex; align-items:center; gap:10px; padding:16px 24px; flex-shrink:0; border-bottom:1px solid transparent; }
  .topbar.scrolled{ border-bottom-color:var(--line); }
  .menu-btn{ display:none; }
  .thread-title{ font-family:'Libre Caslon Text',serif; font-style:italic; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ margin-left:auto; font-family:'Space Mono',monospace; font-size:10px; color:var(--dim); border:1px solid var(--line); padding:4px 9px; flex-shrink:0; border-radius:5px; }

  /* ---- HOME ---- */
  .home{ flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:5vh 20px 40px 20px; }
  .home-inner{ width:100%; max-width:640px; margin:auto 0; }

  .home-greeting{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
  .home-mark-icon{ flex-shrink:0; }
  .home-title{ font-family:'Libre Caslon Text',serif; font-size:clamp(24px,5vw,34px); font-weight:400; line-height:1.2; }
  .home-title em{ font-style:italic; }

  .composer{ display:flex; flex-direction:column; gap:10px; border:1.5px solid var(--ink); border-radius:16px; background:var(--bg); padding:14px 16px; }
  .composer-row{ display:flex; gap:10px; align-items:flex-end; }
  textarea{ flex:1; resize:none; background:transparent; border:none; color:var(--ink); font-family:'Public Sans',sans-serif; font-size:15px; line-height:1.55; padding:6px 0; max-height:160px; }
  textarea::placeholder{ color:var(--faint); }
  textarea:focus{ outline:none; }
  .composer-foot{ display:flex; align-items:center; gap:10px; }
  .model-pill{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:4px 10px; }
  .composer-actions{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .attach-btn{ width:34px; height:34px; border-radius:50%; background:transparent; border:1px solid var(--line); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .12s, border-color .12s; flex-shrink:0; }
  .attach-btn:hover{ background:var(--hover); border-color:var(--ink); }
  .voice-btn{ width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--inv); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity .12s; flex-shrink:0; }
  .voice-btn:hover{ opacity:.82; }
  .voice-btn.listening{ animation:voicePulse 1s ease-in-out infinite; }
  @keyframes voicePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,0.25); } 50%{ box-shadow:0 0 0 6px rgba(0,0,0,0); } }
  .send-btn{
    flex-shrink:0; background:var(--ink); color:var(--inv); border:none; border-radius:50%; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .1s ease, opacity .12s;
  }
  .send-btn:hover:not(:disabled){ transform:scale(1.06); }
  .send-btn:active:not(:disabled){ transform:scale(0.9); }
  .send-btn:disabled{ opacity:.3; cursor:not-allowed; }

  .chip-row{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:22px; }
  .chip-row-center{ display:flex; justify-content:center; margin-top:9px; }
  .chip{
    display:flex; align-items:center; gap:7px; padding:9px 15px; border:1px solid var(--line); border-radius:20px;
    font-size:13px; color:var(--dim); cursor:pointer; background:var(--bg); transition:border-color .12s, color .12s, background .12s;
  }
  .chip:hover{ border-color:var(--ink); color:var(--ink); background:var(--hover); }
  .chip svg{ flex-shrink:0; }
  .chip.pick{ color:var(--dim); }
  .chip.pick svg{ color:var(--faint); }

  /* ---- THREAD VIEW ---- */
  .thread-view{ flex:1; overflow-y:auto; padding:8px 24px 8px 24px; }
  .thread-inner{ max-width:700px; margin:0 auto; }

  .msg-row{ padding:14px 0; }
  .msg-row.user{ display:flex; justify-content:flex-end; padding-bottom:6px; }
  .msg-row.assistant{ padding-top:6px; padding-bottom:22px; }

  .user-bubble{
    max-width:78%; background:var(--ink); color:var(--inv); font-size:15px; line-height:1.55;
    padding:11px 16px; border-radius:16px 16px 4px 16px; white-space:pre-wrap; word-break:break-word;
  }

  .assistant-label{ display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  .assistant-mark{ flex-shrink:0; }
  .assistant-name{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase; }

  .answer{ font-size:15px; line-height:1.75; }
  .answer p{ margin:0 0 14px 0; }
  .answer p:last-child{ margin-bottom:0; }
  .answer h3{ font-family:'Libre Caslon Text',serif; font-size:17px; margin:20px 0 10px 0; font-weight:700; }
  .answer h3:first-child{ margin-top:0; }
  .answer h4{ font-size:14.5px; margin:16px 0 8px 0; font-weight:700; }
  .answer h4:first-child{ margin-top:0; }
  .answer strong{ font-weight:700; }
  .answer em{ font-style:italic; }
  .answer code{ font-family:'Space Mono',monospace; font-size:13px; background:var(--hover); padding:1px 5px; border-radius:4px; }
  .answer ul, .answer ol{ margin:0 0 14px 0; padding-left:20px; }
  .answer li{ margin-bottom:6px; }
  .answer.error{ color:var(--ink); font-style:italic; }
  .answer-meta{ display:flex; align-items:center; gap:7px; margin-top:14px; font-family:'Space Mono',monospace; font-size:10px; color:var(--faint); letter-spacing:.02em; }

  .msg-actions{ display:flex; align-items:center; gap:1px; margin-top:12px; }
  .msg-actions button{ background:transparent; border:none; color:var(--faint); cursor:pointer; padding:7px; border-radius:8px; display:flex; transition:background .12s, color .12s; }
  .msg-actions button:hover{ background:var(--hover); color:var(--ink); }
  .msg-actions button.active{ color:var(--ink); }
  .msg-actions .sep{ width:1px; height:14px; background:var(--line); margin:0 5px; flex-shrink:0; }

  .ctx-backdrop{ position:fixed; inset:0; z-index:55; display:none; }
  .ctx-backdrop.show{ display:block; }
  .ctx-menu{
    position:fixed; z-index:60; background:var(--bg); border:1px solid var(--line); border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18); min-width:190px; padding:6px; display:none;
  }
  .ctx-menu.show{ display:block; }
  .ctx-row{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; font-size:13.5px; cursor:pointer; color:var(--ink); }
  .ctx-row:hover{ background:var(--hover); }
  .ctx-row svg{ color:var(--dim); flex-shrink:0; }

  .thinking-row{ display:flex; align-items:center; gap:12px; padding:6px 0 22px 0; }
  .gavel-loader{ width:18px; height:18px; color:var(--ink); flex-shrink:0; }
  .gavel-loader svg{ display:block; animation:gavelStrike 1.35s cubic-bezier(.45,0,.2,1) infinite; transform-origin:30% 88%; }
  @keyframes gavelStrike{
    0%{ transform:rotate(-16deg); }
    14%{ transform:rotate(9deg); }
    22%{ transform:rotate(5deg); }
    72%{ transform:rotate(5deg); }
    100%{ transform:rotate(-16deg); }
  }

  .think-block{ margin-bottom:16px; }
  .think-toggle{
    display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--faint);
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.02em; cursor:pointer; padding:4px 0;
  }
  .think-toggle:hover{ color:var(--dim); }
  .think-toggle svg{ transition:transform .15s ease; flex-shrink:0; }
  .think-block.open .think-toggle svg{ transform:rotate(90deg); }
  .think-body{
    display:none; margin-top:8px; padding-left:12px; border-left:2px solid var(--line);
    font-size:13px; line-height:1.65; color:var(--dim);
  }
  .think-block.open .think-body{ display:block; }
  .think-body p{ margin:0 0 10px 0; }
  .think-body p:last-child{ margin-bottom:0; }
  .thinking-label{ font-family:'Space Mono',monospace; font-size:11px; color:var(--faint); letter-spacing:.03em; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .followup{ padding:16px 24px calc(18px + var(--safe-b)) 24px; flex-shrink:0; }
  .followup-inner{ max-width:700px; margin:0 auto; }

  /* ================= RESPONSIVE ================= */
  @media(max-width:820px){
    .sidebar{ position:fixed; left:0; top:0; z-index:30; transform:translateX(-100%); transition:transform .2s ease; width:82vw; max-width:300px; height:100%; box-shadow:4px 0 18px rgba(0,0,0,0.15); }
    .sidebar.open{ transform:translateX(0); }
    .menu-btn{ display:flex; }
    .topbar{ padding:13px 16px; }
    .home{ padding:3vh 16px 24px 16px; }
    .home-title{ font-size:23px; }
    .thread-view{ padding:4px 16px; }
    .query-line{ font-size:17px; }
    .followup{ padding:12px 16px calc(16px + var(--safe-b)) 16px; }
    .badge{ display:none; }
  }
  @media(max-width:420px){
    .home-title{ font-size:21px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <svg class="logo-mark" viewBox="0 0 36 36" fill="currentColor">
          <g transform="rotate(-38 18 15)">
            <rect x="9" y="4" width="17" height="8" rx="2.6"/>
            <rect x="14.7" y="12" width="5.6" height="17" rx="2.6"/>
          </g>
          <rect x="5" y="29.5" width="15" height="4.2" rx="2.1"/>
        </svg>
        <span class="mark">LexAI</span>
      </div>
      <div class="sb-head-icons">
        <button class="icon-btn" title="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="menuBtn" title="Close sidebar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
      </div>
    </div>

    <div class="sb-primary">
      <button class="sb-row active" data-mode="research">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>
        Research
      </button>
      <button class="sb-row disabled" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="4" height="18" rx="1"/><rect x="10.5" y="5" width="4" height="16" rx="1"/><rect x="17" y="2" width="4" height="19" rx="1"/></svg>
        Library
        <span class="soon">soon</span>
      </button>
      <button class="sb-row disabled" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8c0-1.1.9-2 2-2h4l2 2.2h8c1.1 0 2 .9 2 2V18c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2z"/></svg>
        Projects
        <span class="soon">soon</span>
      </button>
      <button class="sb-row disabled" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 4c-4 0-9 3-12 8-1.5 2.4-2.3 4.6-2.6 6.1a1 1 0 0 0 1.2 1.2c1.5-.3 3.7-1.1 6.1-2.6 5-3 8-8 8-12 0-.4-.3-.7-.7-.7z"/><path d="M13 11L4 20"/></svg>
        Drafting
        <span class="soon">soon</span>
      </button>
    </div>

    <div class="sb-section">
      <span>Recents</span>
      <span class="sb-filter"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg></span>
    </div>
    <div class="threads" id="threadList"></div>

    <div class="sb-foot">
      <button class="pill-newchat" id="newChatBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
        New chat
      </button>
      <button class="avatar" id="avatarBtn" title="Settings">L</button>
    </div>
  </div>

  <div class="ctx-backdrop" id="ctxBackdrop"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-row" id="ctxCopy">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy message
    </div>
    <div class="ctx-row" id="ctxSelect">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3v4M3 5h4M19 17v4M17 19h4M13 3l8 8-3 3-8-8z"/></svg>
      Select text
    </div>
    <div class="ctx-row" id="ctxEdit">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Edit
    </div>
  </div>

  <div class="modal-backdrop" id="settingsBackdrop">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-profile">
        <div class="modal-avatar">L</div>
        <div>
          <div class="modal-name">LexAI Research</div>
          <div class="modal-plan">Research build · Free</div>
        </div>
      </div>
      <div class="modal-head" style="border-top:1px solid var(--line-soft); border-bottom:none; padding-top:12px;">
        <span class="t">Settings</span>
        <button class="icon-btn" id="closeSettings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="modal-row">

<script>
const SYSTEM_PROMPT = `You are LexAI, an AI legal research assistant built for lawyers and law students, with particular depth in Nigerian law (case law, statutes, the Constitution, court procedure) while remaining useful for general legal reasoning.

How you respond:
- Be precise and structured. Use short paragraphs; use headings or bullet points only for genuinely multi-part answers (e.g. Facts, Issue, Holding, Ratio Decidendi when discussing a case).
- When you reference case law, statutes, or sections, name them plainly (e.g. "Section 36 of the 1999 Constitution (as amended)") but be clear you are recalling this from general training knowledge, not a live, verified case database — you do not have real-time access to a case law corpus in this demo.
- Distinguish clearly between settled legal principle and areas of genuine judicial disagreement.
- Never fabricate a citation, case name, or section number. If you are not confident one exists, say so plainly rather than inventing one.
- Keep tone professional, direct, and useful to a working lawyer — skip filler and disclaimers except where a real ambiguity or risk exists.
- End answers that touch on a live legal decision with a brief, plain note that this is research assistance, not a substitute for independent verification and professional judgment.`;

const CATEGORIES = [
  { icon: `<path d="M12 6.5c-1.4-1-3-1.5-5-1.5-1 0-2 .15-2.5.35v13c.5-.2 1.5-.35 2.5-.35 2 0 3.6.5 5 1.5m0-13c1.4-1 3-1.5 5-1.5 1 0 2 .15 2.5.35v13c-.5-.2-1.5-.35-2.5-.35-2 0-3.6.5-5 1.5m0-13v13"/>`, label: "Explain", prompt: "Explain ratio decidendi vs obiter dicta with an example" },
  { icon: `<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>`, label: "Draft", prompt: "Draft a standard confidentiality clause for an NDA" },
  { icon: `<path d="M12 3v18M5 8l7-5 7 5M5 8l-2 9a2 2 0 0 0 2 2h4M19 8l2 9a2 2 0 0 1-2 2h-4"/>`, label: "Case law", prompt: "Summarize the rule in Carlill v Carbolic Smoke Ball Co." },
  { icon: `<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>`, label: "Procedure", prompt: "Statement of Claim vs Statement of Defence — the difference" },
];

const LEX_PICKS = [
  "What are the essential elements of a valid contract?",
  "Explain the postal rule of acceptance",
  "What is the doctrine of frustration in contract law?",
  "Requirements for a valid affidavit",
  "Explain the mirror image rule in contract acceptance",
];

let threads = [];
let activeId = null;
let loading = false;

function uid(){ return Math.random().toString(36).slice(2,10); }

function newThread(){
  const t = { id: uid(), title: "New chat", messages: [] };
  threads.unshift(t);
  activeId = t.id;
  return t;
}

function activeThread(){ return threads.find(t => t.id === activeId); }

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function inlineFormat(s){
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*(?!\*)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+?)`/g, "<code>$1</code>");
  return s;
}

function formatAnswer(text){
  const lines = escapeHtml(text).split("\n");
  let html = "";
  let listType = null; // "ul" | "ol" | null
  let para = [];

  function flushPara(){
    if(para.length){ html += `<p>${inlineFormat(para.join(" "))}</p>`; para = []; }
  }
  function closeList(){
    if(listType){ html += `</${listType}>`; listType = null; }
  }

  lines.forEach(raw => {
    const line = raw.trim();
    if(line === ""){ closeList(); flushPara(); return; }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if(heading){
      closeList(); flushPara();
      const tag = heading[1].length <= 2 ? "h3" : "h4";
      html += `<${tag}>${inlineFormat(heading[2])}</${tag}>`;
      return;
    }
    const bullet = line.match(/^[-*]\s+(.*)$/);
    if(bullet){
      flushPara();
      if(listType !== "ul"){ closeList(); html += "<ul>"; listType = "ul"; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
      return;
    }
    const numbered = line.match(/^\d+\.\s+(.*)$/);
    if(numbered){
      flushPara();
      if(listType !== "ol"){ closeList(); html += "<ol>"; listType = "ol"; }
      html += `<li>${inlineFormat(numbered[1])}</li>`;
      return;
    }
    closeList();
    para.push(line);
  });
  closeList();
  flushPara();
  return html;
}

function renderSuggestions(){
  const row = document.getElementById("suggestionGrid");
  row.innerHTML = "";
  CATEGORIES.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg><span>${c.label}</span>`;
    chip.addEventListener("click", () => startResearch(c.prompt));
    row.appendChild(chip);
  });

  const pick = document.getElementById("suggestionPick");
  pick.innerHTML = "";
  const pickChip = document.createElement("div");
  pickChip.className = "chip pick";
  pickChip.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg><span>Lex's pick</span>`;
  pickChip.addEventListener("click", () => startResearch(LEX_PICKS[Math.floor(Math.random() * LEX_PICKS.length)]));
  pick.appendChild(pickChip);
}

function renderThreadList(){
  const list = document.getElementById("threadList");
  list.innerHTML = "";
  threads.forEach(t => {
    const el = document.createElement("div");
    el.className = "thread-item" + (t.id === activeId ? " active" : "");
    el.textContent = t.title;
    el.addEventListener("click", () => { activeId = t.id; showThread(); closeSidebarMobile(); });
    list.appendChild(el);
  });
}

function timeOfDay(){
  const h = new Date().getHours();
  if(h >= 5 && h < 12) return "morning";
  if(h >= 12 && h < 17) return "afternoon";
  if(h >= 17 && h < 21) return "evening";
  return "night";
}

function addressTerm(){
  const h = new Date().getHours();
  if(h >= 22 || h < 5) return "night owl";
  const terms = ["counsel", "counsellor"];
  return terms[Math.floor(Math.random() * terms.length)];
}

function pickGreeting(){
  const period = timeOfDay();
  const label = addressTerm();
  return `Good ${period}, <em>${label}</em>`;
}

function showHome(){
  document.getElementById("home").style.display = "flex";
  document.getElementById("threadView").style.display = "none";
  document.getElementById("followup").style.display = "none";
  document.getElementById("threadTitle").textContent = "";
  document.getElementById("homeTitle").innerHTML = pickGreeting();
  activeId = null;
  renderThreadList();
}

function showThread(){
  const t = activeThread();
  if(!t){ showHome(); return; }
  document.getElementById("home").style.display = "none";
  document.getElementById("threadView").style.display = "block";
  document.getElementById("followup").style.display = "block";
  document.getElementById("threadTitle").textContent = t.title;
  renderThreadInner();
  renderThreadList();
}

function renderThreadInner(){
  const t = activeThread();
  const wrap = document.getElementById("threadInner");
  wrap.innerHTML = "";
  t.messages.forEach((m, i) => {
    const row = document.createElement("div");
    if(m.role === "user"){
      row.className = "msg-row user";
      row.innerHTML = `<div class="user-bubble" data-index="${i}">${escapeHtml(m.content)}</div>`;
    } else {
      row.className = "msg-row assistant";
      let inner = `<div class="assistant-label"><svg width="13" height="13" viewBox="0 0 36 36" fill="currentColor" class="assistant-mark"><g transform="rotate(-38 18 15)"><rect x="9" y="4" width="17" height="8" rx="2.6"/><rect x="14.7" y="12" width="5.6" height="17" rx="2.6"/></g><rect x="5" y="29.5" width="15" height="4.2" rx="2.1"/></svg><span class="assistant-name">LexAI</span></div>`;
      if(m.thinking){
        inner += `
          <div class="think-block" data-index="${i}">
            <button class="think-toggle">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
              Thought process
            </button>
            <div class="think-body">${formatAnswer(m.thinking)}</div>
          </div>`;
      }
      inner += `<div class="answer${m.isError ? ' error' : ''}">${formatAnswer(m.content)}</div>`;
      if(!m.isError){
        inner += `
          <div class="msg-actions" data-index="${i}">
            <button class="act-copy" title="Copy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button class="act-share" title="Share"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg></button>
            <button class="act-read" title="Read aloud"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="4 8 8 8 12 4 12 20 8 16 4 16 4 8"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
            <span class="sep"></span>
            <button class="act-up" title="Good response"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM7 11l4-8a2 2 0 0 1 4 1.5V9h5.5a2 2 0 0 1 2 2.3l-1.2 8A2 2 0 0 1 19.3 21H10a3 3 0 0 1-3-3"/></svg></button>
            <button class="act-down" title="Poor response"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 13V3h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1zM17 13l-4 8a2 2 0 0 1-4-1.5V15H3.5a2 2 0 0 1-2-2.3l1.2-8A2 2 0 0 1 4.7 3H14a3 3 0 0 1 3 3"/></svg></button>
            <span class="sep"></span>
            <button class="act-regen" title="Regenerate"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></button>
          </div>
          <div class="answer-meta"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>UNVERIFIED — CONFIRM BEFORE CITING</div>`;
      }
      row.innerHTML = inner;
    }
    wrap.appendChild(row);
  });
  wireMessageActions();
  wireLongPress();
  document.querySelectorAll(".think-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.parentElement.classList.toggle("open");
    });
  });
  if(loading){
    const row = document.createElement("div");
    row.className = "thinking-row";
    row.innerHTML = `<div class="gavel-loader"><svg viewBox="0 0 36 36" fill="currentColor"><g transform="rotate(-32 18 15)"><rect x="9" y="4" width="17" height="8" rx="2.6"/><rect x="14.7" y="12" width="5.6" height="17" rx="2.6"/></g><rect x="5" y="29.5" width="15" height="4.2" rx="2.1"/></svg></div><div class="thinking-label">Reasoning…</div>`;
    wrap.appendChild(row);
  }
  document.getElementById("threadView").scrollTop = document.getElementById("threadView").scrollHeight;
}

async function callClaude(threadMessages){
  const payload = threadMessages.map(m => ({ role: m.role, content: m.content }));
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      system: SYSTEM_PROMPT,
      messages: payload,
    }),
  });
  const data = await response.json();
  let text = "";
  if(data && Array.isArray(data.content)){
    text = data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
  }
  return {
    text: text || (data?.error ? `Lex couldn't generate a response: ${data.error}` : "I couldn't generate a response just now. Please try rephrasing your question."),
    thinking: data?.thinking || "",
  };
}

async function startResearch(text){
  const content = text.trim();
  if(!content || loading) return;
  const t = newThread();
  t.title = content.slice(0,46) + (content.length > 46 ? "…" : "");
  t.messages.push({ role: "user", content });
  showThread();
  loading = true;
  renderThreadInner();
  document.getElementById("homeInput").value = "";
  document.getElementById("followInput").value = "";
  updateSendStates();

  try{
    const reply = await callClaude(t.messages);
    t.messages.push({ role: "assistant", content: reply.text, thinking: reply.thinking });
  } catch(e){
    t.messages.push({ role: "assistant", content: "Something went wrong reaching the AI service. Please try again in a moment.", isError: true });
  } finally {
    loading = false;
    renderThreadInner();
  }
}

function wireMessageActions(){
  const t = activeThread();
  document.querySelectorAll(".msg-actions").forEach(bar => {
    const idx = parseInt(bar.dataset.index, 10);
    const msg = t.messages[idx];

    const copyBtn = bar.querySelector(".act-copy");
    copyBtn.addEventListener("click", () => {
      navigator.clipboard?.writeText(msg.content).catch(() => {});
      copyBtn.classList.add("active");
      setTimeout(() => copyBtn.classList.remove("active"), 900);
    });

    bar.querySelector(".act-share").addEventListener("click", async () => {
      if(navigator.share){
        try{ await navigator.share({ text: msg.content }); } catch(e){ /* cancelled */ }
      } else {
        navigator.clipboard?.writeText(msg.content).catch(() => {});
      }
    });

    const readBtn = bar.querySelector(".act-read");
    readBtn.addEventListener("click", () => {
      if(!("speechSynthesis" in window)) return;
      if(speechSynthesis.speaking){
        speechSynthesis.cancel();
        readBtn.classList.remove("active");
        return;
      }
      const utter = new SpeechSynthesisUtterance(msg.content);
      utter.onend = () => readBtn.classList.remove("active");
      readBtn.classList.add("active");
      speechSynthesis.speak(utter);
    });

    const upBtn = bar.querySelector(".act-up");
    const downBtn = bar.querySelector(".act-down");
    upBtn.addEventListener("click", () => {
      upBtn.classList.toggle("active");
      downBtn.classList.remove("active");
    });
    downBtn.addEventListener("click", () => {
      downBtn.classList.toggle("active");
      upBtn.classList.remove("active");
    });

    bar.querySelector(".act-regen").addEventListener("click", async () => {
      if(loading) return;
      // Drop this assistant message and everything after it, then re-ask
      // using the same conversation up to (and including) the prior user turn.
      t.messages = t.messages.slice(0, idx);
      loading = true;
      renderThreadInner();
      try{
        const reply = await callClaude(t.messages);
        t.messages.push({ role: "assistant", content: reply.text, thinking: reply.thinking });
      } catch(e){
        t.messages.push({ role: "assistant", content: "Something went wrong reaching the AI service. Please try again in a moment.", isError: true });
      } finally {
        loading = false;
        renderThreadInner();
      }
    });
  });
}

let longPressTimer = null;
let ctxTargetIndex = null;

function wireLongPress(){
  document.querySelectorAll(".user-bubble").forEach(bubble => {
    const start = (e) => {
      longPressTimer = setTimeout(() => {
        const rect = bubble.getBoundingClientRect();
        openCtxMenu(rect, parseInt(bubble.dataset.index, 10));
      }, 480);
    };
    const cancel = () => { clearTimeout(longPressTimer); };
    bubble.addEventListener("touchstart", start, { passive: true });
    bubble.addEventListener("touchend", cancel);
    bubble.addEventListener("touchmove", cancel);
    bubble.addEventListener("mousedown", start);
    bubble.addEventListener("mouseup", cancel);
    bubble.addEventListener("mouseleave", cancel);
  });
}

function openCtxMenu(rect, index){
  ctxTargetIndex = index;
  const menu = document.getElementById("ctxMenu");
  const backdrop = document.getElementById("ctxBackdrop");
  menu.style.display = "block";
  const menuWidth = 200;
  let left = Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - 12);
  left = Math.max(12, left);
  let top = rect.bottom + 8;
  if(top + 160 > window.innerHeight) top = rect.top - 168;
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.classList.add("show");
  backdrop.classList.add("show");
}

function closeCtxMenu(){
  document.getElementById("ctxMenu").classList.remove("show");
  document.getElementById("ctxBackdrop").classList.remove("show");
  ctxTargetIndex = null;
}

document.getElementById("ctxBackdrop").addEventListener("click", closeCtxMenu);

document.getElementById("ctxCopy").addEventListener("click", () => {
  const t = activeThread();
  if(t && ctxTargetIndex !== null){
    navigator.clipboard?.writeText(t.messages[ctxTargetIndex].content).catch(() => {});
  }
  closeCtxMenu();
});

document.getElementById("ctxSelect").addEventListener("click", () => {
  if(ctxTargetIndex !== null){
    const el = document.querySelector(`.user-bubble[data-index="${ctxTargetIndex}"]`);
    if(el){
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
  closeCtxMenu();
});

document.getElementById("ctxEdit").addEventListener("click", () => {
  const t = activeThread();
  if(t && ctxTargetIndex !== null){
    const content = t.messages[ctxTargetIndex].content;
    t.messages = t.messages.slice(0, ctxTargetIndex);
    renderThreadInner();
    const input = document.getElementById("followInput");
    input.value = content;
    autoGrow(input);
    updateSendStates();
    input.focus();
  }
  closeCtxMenu();
});

async function followUp(text){


  const content = text.trim();
  if(!content || loading) return;
  const t = activeThread();
  if(!t) return;
  t.messages.push({ role: "user", content });
  loading = true;
  renderThreadInner();
  document.getElementById("followInput").value = "";
  updateSendStates();

  try{
    const reply = await callClaude(t.messages);
    t.messages.push({ role: "assistant", content: reply.text, thinking: reply.thinking });
  } catch(e){
    t.messages.push({ role: "assistant", content: "Something went wrong reaching the AI service. Please try again in a moment.", isError: true });
  } finally {
    loading = false;
    renderThreadInner();
  }
}

function updateSendStates(){
  document.getElementById("homeSendBtn").disabled = !document.getElementById("homeInput").value.trim() || loading;
  document.getElementById("followSendBtn").disabled = !document.getElementById("followInput").value.trim() || loading;
}

function autoGrow(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

const homeInput = document.getElementById("homeInput");
const followInput = document.getElementById("followInput");

homeInput.addEventListener("input", () => { autoGrow(homeInput); updateSendStates(); });
followInput.addEventListener("input", () => { autoGrow(followInput); updateSendStates(); });

homeInput.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); startResearch(homeInput.value); } });
followInput.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); followUp(followInput.value); } });

document.getElementById("homeSendBtn").addEventListener("click", () => startResearch(homeInput.value));
document.getElementById("followSendBtn").addEventListener("click", () => followUp(followInput.value));
document.getElementById("newChatBtn").addEventListener("click", () => { showHome(); closeSidebarMobile(); });

const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
function isDesktop(){ return window.innerWidth > 820; }

function openSidebarMobile(){ sidebar.classList.add("open"); backdrop.classList.add("show"); }
function closeSidebarMobile(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
function closeSidebarAny(){ if(isDesktop()){ /* leave desktop state as-is on nav */ } else { closeSidebarMobile(); } }

function toggleSidebar(){
  if(isDesktop()){
    sidebar.classList.toggle("closed");
  } else {
    if(sidebar.classList.contains("open")) closeSidebarMobile(); else openSidebarMobile();
  }
}

// Sidebar starts closed on desktop (opened only via the toggle icon);
// on mobile it's already off-canvas by default via CSS transform.
if(isDesktop()) sidebar.classList.add("closed");

document.getElementById("openMenuBtn").addEventListener("click", toggleSidebar);
document.getElementById("menuBtn").addEventListener("click", toggleSidebar);
backdrop.addEventListener("click", closeSidebarMobile);

document.getElementById("threadView").addEventListener("scroll", (e) => {
  document.getElementById("topbar").classList.toggle("scrolled", e.target.scrollTop > 4);
});

const settingsBackdrop = document.getElementById("settingsBackdrop");
document.getElementById("avatarBtn").addEventListener("click", () => settingsBackdrop.classList.add("show"));
document.getElementById("closeSettings").addEventListener("click", () => settingsBackdrop.classList.remove("show"));
settingsBackdrop.addEventListener("click", (e) => { if(e.target === settingsBackdrop) settingsBackdrop.classList.remove("show"); });

function wireVoiceDictation(buttonId, inputId){
  const btn = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){
    btn.style.opacity = "0.35";
    btn.title = "Voice input not supported in this browser";
    btn.addEventListener("click", () => {});
    return;
  }
  const recognizer = new SpeechRecognitionCtor();
  recognizer.continuous = false;
  recognizer.interimResults = false;
  recognizer.lang = "en-US";
  let listening = false;

  recognizer.addEventListener("result", (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join(" ");
    input.value = (input.value ? input.value + " " : "") + transcript;
    autoGrow(input);
    updateSendStates();
  });
  recognizer.addEventListener("end", () => { listening = false; btn.classList.remove("listening"); });
  recognizer.addEventListener("error", () => { listening = false; btn.classList.remove("listening"); });

  btn.addEventListener("click", () => {
    if(listening){ recognizer.stop(); return; }
    listening = true;
    btn.classList.add("listening");
    try{ recognizer.start(); } catch(e){ listening = false; btn.classList.remove("listening"); }
  });
}
wireVoiceDictation("homeVoiceBtn", "homeInput");
wireVoiceDictation("followVoiceBtn", "followInput");

renderSuggestions();
showHome();
</script>
